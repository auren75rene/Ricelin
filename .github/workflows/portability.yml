name: portability

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No init-specific calls outside ricelin-sys
        run: sh tools/lint-init-calls.sh
      - name: ricelin-sys self-check
        run: sh tests/test_ricelin_sys.sh
      - name: qs-toggle self-check
        run: sh tests/test_qs_toggle.sh
      - name: ricelin-style self-check
        run: sh tests/test_ricelin_style.sh
      - name: Blade and dock logic
        run: |
          node tests/test_blades.js
          node tests/test_dock.js
      - name: prefix manager safety self-check
        run: sh tests/test_ricelin_prefix.sh
      - name: application registry parser self-check
        run: node tests/test_app_registry_store.js
      - name: Deployment installer self-check
        run: python3 installer/deploy.py
      - name: Shell syntax
        run: |
          sh -n configs/hypr/scripts/ricelin-sys
          sh -n configs/hypr/scripts/ricelin-prefix
          sh -n tests/test_ricelin_prefix.sh
          sh -n tools/lint-init-calls.sh
          sh -n tests/test_ricelin_sys.sh
          sh -n configs/hypr/scripts/qs-toggle.sh
          sh -n tests/test_qs_toggle.sh
          sh -n configs/hypr/scripts/ricelin-style
          sh -n tests/test_ricelin_style.sh
